          )}

          {/* DOCUMENT HISTORY & COMMITS MODAL */}
          {historyDoc && (
            <div className="modal-backdrop" onClick={() => setHistoryDoc(null)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()} style={{ maxWidth: "850px", width: "95%", maxHeight: "90vh", overflow: "auto" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "1px solid var(--border-subtle)", paddingBottom: "12px" }}>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                      <h3 style={{ fontSize: "17px", fontWeight: 800 }}>Document Commit History</h3>
                      <span className="badge badge-method-get">{historyDoc.modelName}</span>
                      <span className={`badge ${docHistoryData?.currentStatus === "active" ? "badge-status-2xx" : "badge-status-5xx"}`}>
                        {docHistoryData?.currentStatus === "active" ? "● Active" : "✕ Currently Deleted"}
                      </span>
                    </div>
                    <div style={{ fontSize: "13px", color: "var(--text-secondary)", marginTop: "4px" }}>
                      <strong>{historyDoc.title}</strong> <span className="code-text" style={{ fontSize: "11px" }}>({historyDoc.docId})</span>
                    </div>
                  </div>
                  <button className="btn btn-secondary" onClick={() => setHistoryDoc(null)}>✕ Close</button>
                </div>

                {loadingHistory ? (
                  <div className="empty-state">Loading revision commits...</div>
                ) : !docHistoryData || docHistoryData.commits?.length === 0 ? (
                  <div className="empty-state">No version commits recorded for this document.</div>
                ) : (
                  <div>
                    <div style={{ fontSize: "12px", color: "var(--text-secondary)", margin: "14px 0 6px" }}>
                      Showing <strong>{docHistoryData.commits.length}</strong> revisions in chronological order:
                    </div>

                    <div className="timeline-list">
                      {docHistoryData.commits.map((commit) => (
                        <div key={commit._id} className="timeline-card">
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                              <span className="badge badge-method-get" style={{ fontWeight: 800, fontSize: "13px" }}>
                                v{commit.version}
                              </span>
                              <span className={`badge ${
                                commit.transactionType === "insert" ? "badge-status-2xx" :
                                commit.transactionType === "delete" ? "badge-status-5xx" :
                                commit.transactionType === "rollback" ? "badge-warning" : "badge-method-put"
                              }`}>
                                {commit.transactionType?.toUpperCase()}
                              </span>
                              <span style={{ fontSize: "13px", fontWeight: 600, color: "var(--text-primary)" }}>
                                {commit.summary || commit.transactionDetails}
                              </span>
                            </div>

                            <div style={{ display: "flex", gap: "6px" }}>
                              <button
                                className="btn btn-secondary"
                                style={{ height: "26px", fontSize: "11px", padding: "0 8px" }}
                                onClick={() => loadReconstructedVersion(historyDoc.modelName, historyDoc.docId, commit.version)}
                              >
                                {selectedHistoryVersion === commit.version ? "Viewing State" : "Reconstruct State"}
                              </button>
                              <button
                                className="btn btn-warning"
                                style={{ height: "26px", fontSize: "11px", padding: "0 8px" }}
                                onClick={() => setRollbackTarget({
                                  modelName: historyDoc.modelName,
                                  docId: historyDoc.docId,
                                  title: historyDoc.title,
                                  version: commit.version,
                                  isDeleted: docHistoryData.currentStatus === "deleted",
                                  maxVersion: docHistoryData.latestVersion,
                                })}
                              >
                                Rollback to v{commit.version}
                              </button>
                            </div>
                          </div>

                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", color: "var(--text-muted)" }}>
                            <span>Author: {commit.user?.email || "System"} | IP: {commit.ipAddress || "Internal"}</span>
                            <span>{new Date(commit.createdAt).toLocaleString()}</span>
                          </div>

                          {/* Render commit changes if update */}
                          {commit.diff?.changes?.length > 0 && (
                            <div className="diff-tree">
                              {commit.diff.changes.map((ch, idx) => (
                                <div key={idx} className={`diff-item ${ch.type}`}>
                                  <span className={`diff-badge ${ch.type}`}>
                                    {ch.type === "added" ? "+" : ch.type === "modified" ? "~" : "-"}
                                  </span>
                                  <div style={{ flex: 1 }}>
                                    <span className="diff-field-name">{ch.field}: </span>
                                    {ch.type === "modified" && (
                                      <span>
                                        <span className="diff-val-old">{typeof ch.oldValue === "object" ? JSON.stringify(ch.oldValue) : String(ch.oldValue)}</span>
                                        <span> → </span>
                                        <span className="diff-val-new">{typeof ch.newValue === "object" ? JSON.stringify(ch.newValue) : String(ch.newValue)}</span>
                                      </span>
                                    )}
                                    {ch.type === "added" && (
                                      <span className="diff-val-new">{typeof ch.newValue === "object" ? JSON.stringify(ch.newValue) : String(ch.newValue)}</span>
                                    )}
                                    {ch.type === "deleted" && (
                                      <span className="diff-val-old">{typeof ch.oldValue === "object" ? JSON.stringify(ch.oldValue) : String(ch.oldValue)}</span>
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* Preview Reconstructed State */}
                    {reconstructedVersionData && (
                      <div style={{ marginTop: "18px", borderTop: "1px solid var(--border-subtle)", paddingTop: "14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                          <h4 style={{ fontSize: "14px", fontWeight: 700 }}>
                            Reconstructed Document at Version {selectedHistoryVersion}
                          </h4>
                          <button className="btn btn-secondary" style={{ height: "24px", fontSize: "11px" }} onClick={() => setReconstructedVersionData(null)}>
                            Hide Preview
                          </button>
                        </div>
                        <JsonViewer data={reconstructedVersionData.state} title={`Document State @ v${selectedHistoryVersion}`} />
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* VERSION COMPARE / GIT DIFF TREE MODAL */}
          {compareDoc && (
            <div className="modal-backdrop" onClick={() => setCompareDoc(null)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()} style={{ maxWidth: "900px", width: "95%", maxHeight: "90vh", overflow: "auto" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--border-subtle)", paddingBottom: "12px" }}>
                  <div>
                    <h3 style={{ fontSize: "17px", fontWeight: 800 }}>Git-Like Version Comparator</h3>
                    <div style={{ fontSize: "13px", color: "var(--text-secondary)", marginTop: "2px" }}>
                      Comparing revisions for <strong>{compareDoc.title}</strong> ({compareDoc.modelName})
                    </div>
                  </div>
                  <button className="btn btn-secondary" onClick={() => setCompareDoc(null)}>✕ Close</button>
                </div>

                {/* VERSION SELECTOR TOOLBAR */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "14px 0", flexWrap: "wrap", gap: "10px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                    <span style={{ fontSize: "13px", fontWeight: 700 }}>Base:</span>
                    <select
                      className="select-field"
                      value={compareV1}
                      onChange={(e) => {
                        const val = parseInt(e.target.value, 10);
                        setCompareV1(val);
                        executeCompare(val, compareV2);
                      }}
                    >
                      {Array.from({ length: Math.max(1, compareDoc.maxVersion || 1) }, (_, i) => i + 1).map((v) => (
                        <option key={v} value={v}>Version {v}</option>
                      ))}
                    </select>

                    <span style={{ fontSize: "14px", fontWeight: 700, color: "var(--text-muted)" }}>⇄</span>

                    <span style={{ fontSize: "13px", fontWeight: 700 }}>Target:</span>
                    <select
                      className="select-field"
                      value={compareV2}
                      onChange={(e) => {
                        const val = parseInt(e.target.value, 10);
                        setCompareV2(val);
                        executeCompare(compareV1, val);
                      }}
                    >
                      {Array.from({ length: Math.max(1, compareDoc.maxVersion || 1) }, (_, i) => i + 1).map((v) => (
                        <option key={v} value={v}>Version {v}</option>
                      ))}
                    </select>

                    <button className="btn btn-primary" onClick={() => executeCompare(compareV1, compareV2)} disabled={loadingCompare}>
                      {loadingCompare ? "Diffing..." : "Compare"}
                    </button>
                  </div>

                  <div style={{ display: "flex", gap: "6px" }}>
                    <button
                      className={`btn ${compareViewTab === "diff" ? "btn-primary" : "btn-secondary"}`}
                      style={{ height: "28px", fontSize: "12px", padding: "0 10px" }}
                      onClick={() => setCompareViewTab("diff")}
                    >
                      Git Diff Tree ({compareData?.diff?.totalChanges || 0})
                    </button>
                    <button
                      className={`btn ${compareViewTab === "json" ? "btn-primary" : "btn-secondary"}`}
                      style={{ height: "28px", fontSize: "12px", padding: "0 10px" }}
                      onClick={() => setCompareViewTab("json")}
                    >
                      Side-by-Side JSON
                    </button>
                  </div>
                </div>

                {loadingCompare ? (
                  <div className="empty-state">Computing deep diff...</div>
                ) : !compareData ? (
                  <div className="empty-state">Select versions to compare.</div>
                ) : (
                  <div>
                    <div style={{ display: "flex", gap: "10px", alignItems: "center", marginBottom: "12px", fontSize: "13px" }}>
                      <span className="badge badge-status-2xx">+{compareData.diff?.addedCount || 0} Added</span>
                      <span className="badge badge-warning">~{compareData.diff?.modifiedCount || 0} Modified</span>
                      <span className="badge badge-status-5xx">-{compareData.diff?.deletedCount || 0} Deleted</span>
                      <span style={{ color: "var(--text-secondary)", fontSize: "12px" }}>
                        {compareData.diff?.summary}
                      </span>
                    </div>

                    {compareViewTab === "diff" ? (
                      <div className="diff-tree">
                        {compareData.diff?.changes?.length === 0 ? (
                          <div className="empty-state" style={{ padding: "20px" }}>
                            ✓ Versions {compareV1} and {compareV2} are identical in content!
                          </div>
                        ) : (
                          compareData.diff.changes.map((ch, idx) => (
                            <div key={idx} className={`diff-item ${ch.type}`}>
                              <span className={`diff-badge ${ch.type}`}>
                                {ch.type === "added" ? "+" : ch.type === "modified" ? "~" : "-"}
                              </span>
                              <div style={{ flex: 1 }}>
                                <span className="diff-field-name">{ch.field}: </span>
                                {ch.type === "modified" && (
                                  <span>
                                    <span className="diff-val-old">{typeof ch.oldValue === "object" ? JSON.stringify(ch.oldValue) : String(ch.oldValue)}</span>
                                    <span> → </span>
                                    <span className="diff-val-new">{typeof ch.newValue === "object" ? JSON.stringify(ch.newValue) : String(ch.newValue)}</span>
                                  </span>
                                )}
                                {ch.type === "added" && (
                                  <span className="diff-val-new">{typeof ch.newValue === "object" ? JSON.stringify(ch.newValue) : String(ch.newValue)}</span>
                                )}
                                {ch.type === "deleted" && (
                                  <span className="diff-val-old">{typeof ch.oldValue === "object" ? JSON.stringify(ch.oldValue) : String(ch.oldValue)}</span>
                                )}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    ) : (
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
                        <JsonViewer data={compareData.v1?.state} title={`Version ${compareV1}`} />
                        <JsonViewer data={compareData.v2?.state} title={`Version ${compareV2}`} />
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ROLLBACK & RESTORE CONFIRMATION MODAL */}
          {rollbackTarget && (
            <div className="modal-backdrop" onClick={() => !rollbackLoading && setRollbackTarget(null)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()} style={{ maxWidth: "480px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <h3 style={{ fontSize: "16px", fontWeight: 800 }}>
                    {rollbackTarget.isDeleted ? "♻️ Resurrect Deleted Document" : "⏪ Rollback Document Version"}
                  </h3>
                  <button className="btn btn-secondary" onClick={() => setRollbackTarget(null)} disabled={rollbackLoading}>✕</button>
                </div>

                <div style={{ margin: "14px 0", fontSize: "13px", lineHeight: "1.6", color: "var(--text-secondary)" }}>
                  <p>
                    Target Document: <strong>{rollbackTarget.title}</strong>
                  </p>
                  <p style={{ marginTop: "6px" }}>
                    Select version to restore:
                  </p>
                  <select
                    className="select-field"
                    style={{ width: "100%", marginTop: "6px", fontWeight: 700 }}
                    value={rollbackTarget.version}
                    onChange={(e) => setRollbackTarget({ ...rollbackTarget, version: parseInt(e.target.value, 10) })}
                  >
                    {Array.from({ length: Math.max(1, rollbackTarget.maxVersion || 1) }, (_, i) => i + 1).map((v) => (
                      <option key={v} value={v}>Restore to Version {v}</option>
                    ))}
                  </select>

                  <div style={{ background: "var(--bg-surface-elevated)", padding: "10px", borderRadius: "8px", border: "1px solid var(--border-subtle)", marginTop: "12px", fontSize: "12px" }}>
                    {rollbackTarget.isDeleted ? (
                      <span style={{ color: "var(--success)" }}>
                        ✓ This will resurrect the deleted document back into active MongoDB collection with its original _id.
                      </span>
                    ) : (
                      <span style={{ color: "var(--warning)" }}>
                        ⚠ This will overwrite active document fields with the reconstructed state at Version {rollbackTarget.version}.
                      </span>
                    )}
                    <div style={{ marginTop: "4px", color: "var(--text-muted)" }}>
                      A new rollback commit will be recorded preserving the full audit trail.
                    </div>
                  </div>
                </div>

                <div style={{ display: "flex", justifyContent: "flex-end", gap: "8px" }}>
                  <button className="btn btn-secondary" onClick={() => setRollbackTarget(null)} disabled={rollbackLoading}>
                    Cancel
                  </button>
                  <button
                    className="btn btn-primary"
                    onClick={() => executeRollback(rollbackTarget.modelName, rollbackTarget.docId, rollbackTarget.version)}
                    disabled={rollbackLoading}
                  >
                    {rollbackLoading ? "Restoring..." : "Confirm Rollback"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
