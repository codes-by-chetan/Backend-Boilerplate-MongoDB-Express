version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Express API & Admin Sentinel App
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_boilerplate_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/backend_boilerplate
      - DB_NAME=backend_boilerplate
      - CORS_ORIGIN=*
      - ACCESS_TOKEN_SECRET_KEY=3e7720af882c40de0c3abdb9365c852fc3f741c8cb6e181da6bfb749d486f1f6
      - ACCESS_TOKEN_EXPIRY=15m
      - REFRESH_TOKEN_SECRET_KEY=a7d23d8c199e4c19b22a8fb48392ce908bf41160a48b30d97034fe494e820ef0
      - REFRESH_TOKEN_EXPIRY=7d
      - CLIENT_URL=http://localhost:3000/admin
      - SELF_HOST_URL=http://localhost:3000
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_SECURE=false
      - EMAIL_FROM=Enterprise Security <noreply@boilerplate.local>
      - BOOTSTRAP_ADMIN=true
      - ADMIN_NAME=System Admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=Admin@12345
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - app_logs:/app/logs

  # ----------------------------------------------------------------------------
  # 2. MongoDB Database
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: express_boilerplate_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Mailpit Local SMTP Server & Webmail UI
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: express_boilerplate_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Interactive Webmail Inbox UI
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  mongo_data:
  app_logs:
  mailpit_data:
